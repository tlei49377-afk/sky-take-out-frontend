<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 助手 - 智能外卖平台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      background: #f5f7fa;
      color: #303133;
      overflow: hidden;
    }

    .chat-app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #fff;
    }

    /* ---------- 顶部 ---------- */
    .chat-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px;
      border-bottom: 1px solid #ebeef5;
      background: #fff;
    }

    .chat-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 600;
      color: #303133;
    }

    .chat-title .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #67c23a;
      box-shadow: 0 0 0 3px rgba(103, 194, 58, .15);
    }

    .chat-title .sub {
      font-size: 12px;
      font-weight: 400;
      color: #909399;
      margin-left: 4px;
    }

    .btn-new {
      padding: 7px 15px;
      font-size: 13px;
      color: #409eff;
      background: #ecf5ff;
      border: 1px solid #b3d8ff;
      border-radius: 4px;
      cursor: pointer;
      transition: all .2s;
    }

    .btn-new:hover { background: #409eff; color: #fff; border-color: #409eff; }

    /* ---------- 消息区 ---------- */
    .chat-body {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 22px;
      background: #f5f7fa;
      scroll-behavior: smooth;
    }

    .chat-body::-webkit-scrollbar { width: 6px; }
    .chat-body::-webkit-scrollbar-thumb { background: #dcdfe6; border-radius: 3px; }
    .chat-body::-webkit-scrollbar-thumb:hover { background: #c0c4cc; }

    .msg {
      display: flex;
      gap: 11px;
      margin-bottom: 20px;
      align-items: flex-start;
    }

    .msg.user { flex-direction: row-reverse; }

    .avatar {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      user-select: none;
    }

    .msg.ai .avatar { background: linear-gradient(135deg, #409eff, #6fb4ff); }
    .msg.user .avatar { background: linear-gradient(135deg, #67c23a, #8fd46a); }

    .bubble {
      max-width: 74%;
      padding: 11px 15px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.7;
      word-break: break-word;
      white-space: pre-wrap;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .05);
    }

    .msg.ai .bubble {
      background: #fff;
      border: 1px solid #ebeef5;
      border-top-left-radius: 2px;
    }

    .msg.user .bubble {
      background: #409eff;
      color: #fff;
      border-top-right-radius: 2px;
    }

    .bubble pre {
      margin: 0;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* 打字光标 */
    .cursor {
      display: inline-block;
      width: 7px;
      height: 15px;
      background: #409eff;
      vertical-align: text-bottom;
      animation: blink 1s steps(2, start) infinite;
      margin-left: 2px;
    }

    @keyframes blink { to { visibility: hidden; } }

    /* 思考中动画 */
    .thinking { display: flex; gap: 5px; padding: 3px 0; }
    .thinking span {
      width: 7px; height: 7px; border-radius: 50%; background: #c0c4cc;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .thinking span:nth-child(1) { animation-delay: -.32s; }
    .thinking span:nth-child(2) { animation-delay: -.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(.6); opacity: .5; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* ---------- 欢迎语 ---------- */
    .welcome {
      text-align: center;
      padding: 40px 20px 10px;
      color: #909399;
    }

    .welcome h2 {
      font-size: 19px;
      font-weight: 600;
      color: #303133;
      margin-bottom: 8px;
    }

    .welcome p { font-size: 13px; line-height: 1.8; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 22px;
    }

    .chip {
      padding: 8px 15px;
      font-size: 13px;
      color: #606266;
      background: #fff;
      border: 1px solid #dcdfe6;
      border-radius: 16px;
      cursor: pointer;
      transition: all .2s;
    }

    .chip:hover {
      color: #409eff;
      border-color: #409eff;
      background: #ecf5ff;
      transform: translateY(-1px);
    }

    /* ---------- 输入区 ---------- */
    .chat-footer {
      flex: 0 0 auto;
      padding: 14px 22px 18px;
      border-top: 1px solid #ebeef5;
      background: #fff;
    }

    .input-wrap {
      display: flex;
      align-items: flex-end;
      gap: 11px;
      border: 1px solid #dcdfe6;
      border-radius: 8px;
      padding: 9px 12px;
      transition: border-color .2s, box-shadow .2s;
      background: #fff;
    }

    .input-wrap:focus-within {
      border-color: #409eff;
      box-shadow: 0 0 0 3px rgba(64, 158, 255, .1);
    }

    #input {
      flex: 1 1 auto;
      border: none;
      outline: none;
      resize: none;
      font-size: 14px;
      line-height: 1.6;
      font-family: inherit;
      color: #303133;
      max-height: 120px;
      min-height: 24px;
      background: transparent;
    }

    #input::placeholder { color: #c0c4cc; }

    .btn-send {
      flex: 0 0 auto;
      padding: 8px 20px;
      font-size: 14px;
      color: #fff;
      background: #409eff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background .2s;
    }

    .btn-send:hover:not(:disabled) { background: #66b1ff; }
    .btn-send:disabled { background: #a0cfff; cursor: not-allowed; }

    .tip {
      margin-top: 8px;
      font-size: 12px;
      color: #c0c4cc;
      text-align: center;
    }

    /* 错误提示 */
    .msg-error {
      max-width: 74%;
      padding: 11px 15px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
      background: #fef0f0;
      color: #f56c6c;
      border: 1px solid #fde2e2;
    }
  </style>
</head>
<body>
  <div class="chat-app">

    <div class="chat-header">
      <div class="chat-title">
        <span class="dot"></span>
        AI 助手
        <span class="sub">业务数据智能查询</span>
      </div>
      <button class="btn-new" id="btnNew">+ 新建会话</button>
    </div>

    <div class="chat-body" id="chatBody">
      <div class="welcome" id="welcome">
        <h2>你好，我是智能外卖平台 AI 助手 👋</h2>
        <p>我可以帮你查询菜品、分类和订单信息<br>试试问我下面的问题吧</p>
        <div class="chips">
          <div class="chip" data-q="查询鱼香肉丝的菜品信息">查询鱼香肉丝</div>
          <div class="chip" data-q="查询所有热菜分类">查询热菜分类</div>
          <div class="chip" data-q="查询订单号 123456 的订单">按订单号查订单</div>
          <div class="chip" data-q="查询手机号 13800138000 的订单">按手机号查订单</div>
        </div>
      </div>
    </div>

    <div class="chat-footer">
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="输入你的问题，Enter 发送，Shift + Enter 换行"></textarea>
        <button class="btn-send" id="btnSend">发送</button>
      </div>
      <div class="tip">AI 生成内容仅供参考，请核对业务数据</div>
    </div>

  </div>

  <script>
  (function () {
    'use strict';

    var API = '/api/chat';                 // 经 nginx 转发到后端 /admin/chat
    var MEMORY_KEY = 'sky_ai_memory_id';   // localStorage 中保存的会话 id

    var chatBody = document.getElementById('chatBody');
    var welcome  = document.getElementById('welcome');
    var input    = document.getElementById('input');
    var btnSend  = document.getElementById('btnSend');
    var btnNew   = document.getElementById('btnNew');

    var sending = false;

    /* ---------- 工具函数 ---------- */

    function getCookie(name) {
      var m = document.cookie.match(new RegExp('(?:^|;\\s*)' + name + '=([^;]*)'));
      return m ? decodeURIComponent(m[1]) : '';
    }

    // 每个浏览器会话一个 memoryId，用于后端区分对话上下文
    function getMemoryId() {
      var id = null;
      try { id = localStorage.getItem(MEMORY_KEY); } catch (e) {}
      if (!id) {
        id = 'web_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
        try { localStorage.setItem(MEMORY_KEY, id); } catch (e) {}
      }
      return id;
    }

    function resetMemoryId() {
      var id = 'web_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
      try { localStorage.setItem(MEMORY_KEY, id); } catch (e) {}
      return id;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // 后端按 system.txt 约定返回 JSON，这里美化显示；不是 JSON 就原样输出
    function renderContent(text) {
      var trimmed = text.trim();
      if (trimmed.charAt(0) === '{' || trimmed.charAt(0) === '[') {
        try {
          var obj = JSON.parse(trimmed);
          return '<pre>' + escapeHtml(JSON.stringify(obj, null, 2)) + '</pre>';
        } catch (e) { /* 不是完整 JSON，按纯文本处理 */ }
      }
      return escapeHtml(text);
    }

    function scrollToBottom() {
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function hideWelcome() {
      if (welcome && welcome.parentNode) {
        welcome.parentNode.removeChild(welcome);
        welcome = null;
      }
    }

    /* ---------- 消息渲染 ---------- */

    function addMessage(role, html) {
      hideWelcome();

      var msg = document.createElement('div');
      msg.className = 'msg ' + role;

      var avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'user' ? '我' : 'AI';

      var bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = html;

      msg.appendChild(avatar);
      msg.appendChild(bubble);
      chatBody.appendChild(msg);
      scrollToBottom();
      return bubble;
    }

    function addError(text) {
      hideWelcome();
      var msg = document.createElement('div');
      msg.className = 'msg ai';

      var avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = 'AI';

      var box = document.createElement('div');
      box.className = 'msg-error';
      box.textContent = text;

      msg.appendChild(avatar);
      msg.appendChild(box);
      chatBody.appendChild(msg);
      scrollToBottom();
    }

    /* ---------- 发送逻辑 ---------- */

    function setSending(state) {
      sending = state;
      btnSend.disabled = state;
      btnSend.textContent = state ? '回复中' : '发送';
    }

    async function send(question) {
      if (sending) return;
      question = (question || '').trim();
      if (!question) return;

      var token = getCookie('token');
      if (!token) {
        addError('未检测到登录状态，请先在系统中登录后再使用 AI 助手。');
        return;
      }

      addMessage('user', escapeHtml(question));
      input.value = '';
      input.style.height = 'auto';
      setSending(true);

      // AI 气泡 + 思考动画
      var bubble = addMessage('ai', '<div class="thinking"><span></span><span></span><span></span></div>');
      var answer = '';
      var firstChunk = true;

      try {
        var url = API
          + '?memoryId=' + encodeURIComponent(getMemoryId())
          + '&memory='   + encodeURIComponent(question);

        var resp = await fetch(url, {
          method: 'GET',
          headers: { 'token': token }
        });

        if (!resp.ok) {
          throw new Error('HTTP ' + resp.status + ' ' + resp.statusText);
        }

        if (resp.body && typeof resp.body.getReader === 'function') {
          // 流式读取
          var reader  = resp.body.getReader();
          var decoder = new TextDecoder('utf-8');

          while (true) {
            var chunk = await reader.read();
            if (chunk.done) break;

            answer += decoder.decode(chunk.value, { stream: true });

            if (firstChunk) { firstChunk = false; bubble.innerHTML = ''; }
            bubble.innerHTML = renderContent(answer) + '<span class="cursor"></span>';
            scrollToBottom();
          }
        } else {
          // 浏览器不支持流式读取时的兜底
          answer = await resp.text();
        }

        if (!answer) {
          bubble.innerHTML = '<span style="color:#909399">（AI 没有返回内容）</span>';
        } else {
          bubble.innerHTML = renderContent(answer);
        }

      } catch (err) {
        if (firstChunk) {
          bubble.innerHTML = '';
          bubble.appendChild(document.createTextNode(''));
        }
        bubble.parentNode.removeChild(bubble);
        addError('请求失败：' + (err && err.message ? err.message : err) +
                 '\n请确认后端服务已启动。');
      } finally {
        setSending(false);
        scrollToBottom();
        input.focus();
      }
    }

    /* ---------- 事件绑定 ---------- */

    btnSend.addEventListener('click', function () { send(input.value); });

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send(input.value);
      }
    });

    // 高度自适应
    input.addEventListener('input', function () {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });

    // 快捷提问
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (chip) {
      chip.addEventListener('click', function () { send(chip.getAttribute('data-q')); });
    });

    // 新建会话：换一个 memoryId，清空界面
    btnNew.addEventListener('click', function () {
      resetMemoryId();
      chatBody.innerHTML = '';
      welcome = null;
      chatBody.innerHTML =
        '<div class="welcome" id="welcome">' +
          '<h2>新会话已开始 ✨</h2>' +
          '<p>之前的对话上下文已清除，可以开始新的提问了</p>' +
        '</div>';
      welcome = document.getElementById('welcome');
      input.focus();
    });

    input.focus();
  })();
  </script>
</body>
</html>
