server:
  port: 8080

spring:
  profiles:
    active: dev
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}
  data:
    redis:
      host: ${sky.redis.host}
      port: ${sky.redis.port}
      password: ${sky.redis.password}
      database: ${sky.redis.database}

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info
  pattern:
    # 日志里带上 traceId，方便把一个请求的多行日志串起来
    correlation: "[%X{traceId:-}] "

management:
  endpoints:
    web:
      exposure:
        # 只放开需要的几个，生产环境这些端点要挂到内网或加认证
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  info:
    # 让 /actuator/info 有内容：构建信息、JDK 与操作系统版本
    build:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  metrics:
    tags:
      application: sky-take-out

sky:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: ${SKY_JWT_ADMIN_SECRET}
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token

    user-secret-key: ${SKY_JWT_USER_SECRET}
    user-ttl: 7200000
    user-token-name: authentication
  alioss:
    endpoint: ${sky.alioss.endpoint}
    access-key-id: ${sky.alioss.access-key-id}
    access-key-secret: ${sky.alioss.access-key-secret}
    bucket-name: ${sky.alioss.bucket-name}
  wechat:
    # 商户号（从 sky.wechat.mchid 配置项读取）
    mchid: ${sky.wechat.mchid}
    # 商户API证书序列号（从 sky.wechat.mchSerialNo 配置项读取）
    mchSerialNo: ${sky.wechat.mchSerialNo}
    # 商户私钥文件路径（从 sky.wechat.privateKeyFilePath 配置项读取）
    # privateKeyFilePath: ${sky.wechat.privateKeyFilePath}
    # 微信支付V3 API密钥（从 sky.wechat.apiV3Key 配置项读取）
    apiV3Key: ${sky.wechat.apiV3Key}
    # 微信支付平台证书文件路径（从 sky.wechat.weChatPayCertFilePath 配置项读取）
    # weChatPayCertFilePath: ${sky.wechat.weChatPayCertFilePath}
    # 支付成功回调地址（从 sky.wechat.notifyUrl 配置项读取）
    notifyUrl: ${sky.wechat.notifyUrl}
    # 退款成功回调地址（从 sky.wechat.refundNotifyUrl 配置项读取）
    refundNotifyUrl: ${sky.wechat.refundNotifyUrl}
  shop:
    address: ${sky.shop.address}
  baidu:
    ak: ${sky.baidu.ak}

langchain4j:
  open-ai:
    chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${QW-API-KEY}
      model-name: qwen-plus
      log-requests: true
      log-responses: true
    streaming-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${QW-API-KEY}
      model-name: qwen-plus
      log-requests: true
      log-responses: true
    embedding-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${QW-API-KEY}
      model-name: qwen3.7-text-embedding-flash
      log-requests: true
      log-responses: true
      max-segments-per-batch: 20
  community:
    redis:
      host: localhost
      port: 6380
      dimension: 1024
